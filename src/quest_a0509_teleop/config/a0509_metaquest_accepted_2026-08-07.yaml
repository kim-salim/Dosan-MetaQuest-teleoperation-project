xyz_mapper_node:
  ros__parameters:
    input_pose_topic: /q2r_right_hand_pose
    target_posx_topic: /vr/target_posx
    status_topic: /vr/status
    robot_anchor_posx_topic: /vr/robot_anchor_posx
    teleop_ready_topic: /vr/teleop_ready
    live_state_topic: /vr/live_robot_output_enabled
    valid_pose_heartbeat_topic: /control/metaquest/valid_pose_heartbeat
    require_prepare_before_target: true
    robot_anchor_xyz_mm: [400.0, 0.0, 350.0]
    robot_anchor_rpy_deg: [0.0, 0.0, 0.0]
    scale_xyz: [0.85, 0.85, 0.85]
    axis_sign: [1.0, -1.0, 1.0]
    # Robot x <- Quest y, Robot y <- Quest x, Robot z <- Quest z.
    axis_map: [1, 0, 2]
    enable_xy_yaw_correction: true
    xy_yaw_correction_deg: 0.0
    require_xy_yaw_calibration: true
    xy_yaw_calibration_duration_sec: 2.0
    xy_yaw_calibration_min_distance_m: 0.04
    xy_yaw_calibration_service: /vr/calibrate_xy_yaw_to_x_plus
    xy_yaw_calibration_reset_service: /vr/reset_xy_yaw_calibration
    xy_yaw_calibration_valid_topic: /vr/metaquest_calibration/valid
    xy_yaw_calibration_status_topic: /vr/metaquest_calibration/status
    publish_rate_hz: 30.0
    auto_recenter_on_first_pose: true
    recenter_vr_on_robot_anchor_update: true
    input_timeout_sec: 0.5
    # Quest packets arrive in short bursts despite averaging about 72 Hz.
    # Re-sample receive-time poses on the existing 30 Hz Mapper tick so no
    # additional ROS timer phase is introduced.
    enable_pose_resampling: true
    pose_interpolation_delay_sec: 0.05
    pose_buffer_duration_sec: 1.0
    pose_buffer_max_samples: 128
    pose_max_interpolation_gap_sec: 0.08
    pose_full_prediction_sec: 0.02
    pose_prediction_decay_sec: 0.08
    pose_velocity_estimation_min_sec: 0.02
    pose_max_prediction_linear_speed_m_s: 0.5
    pose_max_prediction_angular_speed_deg_s: 90.0
    pose_tracking_invalid_after_sec: 0.3
    pose_filter_reference_rate_hz: 72.0
    enable_pose_low_pass_filter: true
    pose_filter_alpha: 0.4
    max_vr_jump_m: 0.20
    enable_orientation_mapping: true
    scale_rpy: [0.0, 0.7, 0.0]
    rot_axis_sign: [-1.0, -1.0, -1.0]
    # Robot rx <- Quest pitch disabled, Robot ry <- Quest roll, Robot rz <- Quest yaw disabled.
    rot_axis_map: [1, 0, 2]
    enable_orientation_low_pass_filter: true
    orientation_filter_alpha: 0.4
    max_vr_rot_jump_deg: 45.0
    roll_only_deadband_deg: 1.0
    roll_only_filter_alpha: 0.35
    roll_lock_toggle_service: /vr/toggle_roll_lock

quest_input_button_node:
  ros__parameters:
    input_topic: /q2r_right_hand_inputs
    status_topic: /vr/status
    grip_input_field: press_middle
    grip_threshold: 0.5
    debounce_sec: 0.7
    teleop_ready_topic: /vr/teleop_ready
    require_teleop_ready: true
    toggle_roll_lock_service: /vr/toggle_roll_lock

safety_guard_node:
  ros__parameters:
    target_posx_topic: /vr/target_posx
    safe_posx_topic: /vr/safe_posx
    status_topic: /vr/status
    robot_anchor_posx_topic: /vr/robot_anchor_posx
    workspace_min_xyz_mm: [50.0, -350.0, 0.0]
    workspace_min_limit_enabled: [true, true, false]
    workspace_max_xyz_mm: [650.0, 350.0, 600.0]
    enable_orientation_limits: true
    max_orientation_delta_deg: [90.0, 90.0, 90.0]
    publish_rate_hz: 30.0

servol_rt_streamer_node:
  ros__parameters:
    safe_posx_topic: /vr/safe_posx
    doosan_servol_topic: /dsr01/dsr_controller2/servol_rt_stream
    status_topic: /vr/status
    teleop_ready_topic: /vr/teleop_ready
    robot_namespace: /dsr01
    dry_run: true
    live_enabled: false
    require_live_enable: true
    require_prepare_before_live: true
    require_robot_ready: true
    safe_robot_states: [1, 2]
    robot_state_topic: /rt_topic/robot_state
    robot_state_stale_timeout_sec: 1.0
    publish_rate_hz: 30.0
    executor_num_threads: 4
    executor_yield_sec: 0.001
    servol_time_sec: 0.1
    # DR_COND_NONE (-10000): let the Doosan controller derive continuous
    # endpoint velocity and acceleration from each streamed target pose.
    servol_use_auto_velocity_acceleration: true
    stream_ramp_linear_mm_per_tick: 6.67
    stream_ramp_rot_deg_per_tick: 1.0
    commanded_posx_topic: /vr/commanded_posx
    live_state_topic: /vr/live_robot_output_enabled
    selected_heartbeat_topic: /control/selected_command_heartbeat
    require_mux_heartbeat: false
    mux_heartbeat_timeout_sec: 1.0
    enable_timing_trace: true
    timing_trace_dir: /tmp/teleop_diagnostics
    timing_trace_max_samples: 12000

a0509_command_mux_node:
  ros__parameters:
    initial_control_source: DISABLED
    metaquest_target_topic: /control/metaquest/target_posx
    metaquest_gripper_topic: /control/metaquest/gripper_cmd
    metaquest_heartbeat_topic: /control/metaquest/valid_pose_heartbeat
    metaquest_calibration_valid_topic: /vr/metaquest_calibration/valid
    require_metaquest_calibration: true
    lerobot_target_topic: /control/lerobot/target_posx
    lerobot_gripper_topic: /control/lerobot/gripper_target
    selected_target_topic: /vr/target_posx
    selected_gripper_topic: /jrt_gripper/cmd
    source_topic: /control/source
    mux_status_topic: /control/mux_status
    selected_heartbeat_topic: /control/selected_command_heartbeat
    selected_valid_topic: /control/selected_command_valid
    live_state_topic: /vr/live_robot_output_enabled
    teleop_ready_topic: /vr/teleop_ready
    gripper_commanded_state_topic: /jrt_gripper/commanded_state
    metaquest_timeout_sec: 1.0
    lerobot_timeout_sec: 0.3
    gripper_open_threshold: 0.3
    gripper_close_threshold: 0.7
    metaquest_gripper_min_pulse_sec: 1.50

robot_prep_node:
  ros__parameters:
    robot_namespace: /dsr01
    status_topic: /vr/status
    robot_anchor_posx_topic: /vr/robot_anchor_posx
    teleop_ready_topic: /vr/teleop_ready
    recenter_service: /vr/recenter
    set_live_service: /vr/set_live_robot_output
    prepare_joint_deg: [0.0, 0.0, 90.0, 0.0, 60.0, 0.0]
    prepare_joint_tolerance_deg: 2.0
    prepare_max_step_deg: 10.0
    prepare_j3_escape_deg: 20.0
    prepare_j5_escape_deg: 30.0
    prepare_j3_step_deg: 5.0
    prepare_j5_step_deg: 3.0
    prepare_vel_deg_per_sec: 30.0
    prepare_acc_deg_per_sec2: 30.0
    prepare_time_sec: 0.0
    prepare_preflight_wait_sec: 3.0
    prepare_set_anchor_after_move: true
    safe_robot_states: [1, 2]
    stop_mode: 1

